<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Webpage</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Welcome to My Page</h1>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home">
            <h2>Home</h2>
            <p>This is a simple webpage created with HTML and CSS.</p>
        </section>

        <section id="about">
            <h2>About</h2>
            <p>Learn more about what we do.</p>
        </section>

        <section id="contact">
            <h2>Contact</h2>
            <p>Get in touch with us!</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 My Simple Webpage. All rights reserved.</p>
    </footer>
    <script>
/* ================= HELPER: COORDONATE ================= */
async function getCoordinates(cityName) {
  const response = await fetch(
    `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=en&format=json`
  );
  const data = await response.json();

  if (!data.results || data.results.length === 0) {
    throw new Error("City not found");
  }

  return {
    lat: data.results[0].latitude,
    lon: data.results[0].longitude,
    name: data.results[0].name,
    country: data.results[0].country
  };
}

/* ================= WEATHER CODES ================= */
const weatherCodes = {
  0: "☀ Clear sky",
  1: "🌤 Mainly clear",
  2: "⛅ Partly cloudy",
  3: "☁ Overcast",
  61: "🌧 Rain",
  71: "❄ Snow",
  95: "⛈ Thunderstorm"
};

/* ================= CURRENT WEATHER ================= */
async function getCurrentWeather() {
  const city = document.getElementById("city-current").value;
  const result = document.getElementById("current-weather-result");
  result.innerHTML = "Loading...";

  try {
    const loc = await getCoordinates(city);
    const response = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current_weather=true`
    );
    const data = await response.json();
    const w = data.current_weather;

    result.innerHTML = `
      <p><b>${loc.name}, ${loc.country}</b></p>
      <p>🌡 ${w.temperature} °C</p>
      <p>💨 Wind: ${w.windspeed} km/h</p>
      <p>${weatherCodes[w.weathercode] || "Unknown"}</p>
    `;
  } catch (err) {
    result.innerHTML = err.message;
  }
}

/* ================= WEEK FORECAST ================= */
async function getWeekForecast() {
  const city = document.getElementById("city-forecast").value;
  const result = document.getElementById("forecast-result");
  result.innerHTML = "Loading...";

  try {
    const loc = await getCoordinates(city);
    const response = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&daily=temperature_2m_max,temperature_2m_min&timezone=auto`
    );
    const data = await response.json();

    let html = `<b>${loc.name}</b><br>`;
    for (let i = 0; i < 7; i++) {
      html += `
        <p>${data.daily.time[i]}: 
        ${data.daily.temperature_2m_max[i]}°C /
        ${data.daily.temperature_2m_min[i]}°C</p>
      `;
    }
    result.innerHTML = html;
  } catch (err) {
    result.innerHTML = err.message;
  }
}

/* ================= HOURLY ================= */
async function getHourlyTemperature() {
  const city = document.getElementById("city-hourly").value;
  const result = document.getElementById("hourly-result");
  result.innerHTML = "Loading...";

  try {
    const loc = await getCoordinates(city);
    const response = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&hourly=temperature_2m&forecast_days=1`
    );
    const data = await response.json();

    let html = `<b>${loc.name}</b><br>`;
    for (let i = 0; i < 24; i++) {
      html += `<p>${data.hourly.time[i]} → ${data.hourly.temperature_2m[i]}°C</p>`;
    }
    result.innerHTML = html;
  } catch (err) {
    result.innerHTML = err.message;
  }
}

/* ================= AIR QUALITY ================= */
async function getAirQuality() {
  const city = document.getElementById("city-air").value;
  const result = document.getElementById("air-quality-result");
  result.innerHTML = "Loading...";

  try {
    const loc = await getCoordinates(city);
    const response = await fetch(
      `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${loc.lat}&longitude=${loc.lon}&current=pm10,pm2_5,european_aqi`
    );
    const data = await response.json();

    result.innerHTML = `
      <p><b>${loc.name}</b></p>
      <p>AQI: ${data.current.european_aqi}</p>
      <p>PM10: ${data.current.pm10}</p>
      <p>PM2.5: ${data.current.pm2_5}</p>
    `;
  } catch (err) {
    result.innerHTML = err.message;
  }
}
</script>

</body>
</html>
