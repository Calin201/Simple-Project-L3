<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to My Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #35424a;
            color: white;
            text-align: center;
            padding: 20px 0;
        }

        header h1 {
            margin: 0 0 15px 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        main {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 20px;
        }

        section {
            background-color: #ffffff;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #35424a;
            margin-bottom: 1rem;
        }

        #despre {
            background-color: #655d5d;
        }

        #despre h2, #despre p {
            color: #333;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Page</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <p>Bine ați venit pe pagina mea web!</p>

        <section id="despre">
            <h2>Despre Mine</h2>
            <p>Sunt un student pasionat de tehnologie și dezvoltare web.</p>
        </section>

        <section id="home">
            <h2>Home</h2>
            <p>This is a simple webpage created with HTML and CSS.</p>
        </section>

        <section id="about">
            <h2>About</h2>
            <p>Learn more about what we do.</p>
        </section>

        <section id="contact">
            <h2>Contact</h2>
            <p>Get in touch with us!</p>
        </section>
    </main>

</body>
</html>
