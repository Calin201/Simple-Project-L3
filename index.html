<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Webpage</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Welcome to My Page</h1>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home">
            <h2>Home</h2>
            <p>This is a simple webpage created with HTML and CSS.</p>
        </section>

        <section id="about">
            <h2>About</h2>
            <p>Learn more about what we do.</p>
        </section>

        <section id="contact">
            <h2>Contact</h2>
            <p>Get in touch with us!</p>
        </section>

        <section id="galerie">
            <h2>Galerie</h2>
            <div class="galerie-grid">
                <img src="https://placehold.co/400x300?text=Imagine+1" alt="Imagine din galerie 1">
                <img src="https://placehold.co/400x300?text=Imagine+2" alt="Imagine din galerie 2">
                <img src="https://placehold.co/400x300?text=Imagine+3" alt="Imagine din galerie 3">
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 My Simple Webpage. All rights reserved.</p>
    </footer>
</body>
</html>
