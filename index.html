<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Crypto Converter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Live Crypto Converter</h1>

    <div class="card">
        <input 
            type="number" 
            id="btcAmount" 
            placeholder="Enter BTC amount" 
        />

        <p id="btcPrice">BTC Price: — USD</p>

        <table>
            <thead>
                <tr>
                    <th>Cryptocurrency</th>
                    <th>Amount in USD</th>
                </tr>
            </thead>
            <tbody id="cryptoTable"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
